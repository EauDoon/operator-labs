name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: corridor-lab-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q src
      - name: Install pinned build backend
        run: python -m pip install --disable-pip-version-check --no-deps "setuptools==83.0.0"
      - name: Build exact local wheel outside checkout
        shell: pwsh
        run: |
          $checkoutRoot = (Get-Location).Path
          $sourceRoot = Join-Path $env:RUNNER_TEMP "corridor-lab-wheel-source"
          $wheelDir = Join-Path $env:RUNNER_TEMP "corridor-lab-wheel"
          New-Item -ItemType Directory -Force -Path $sourceRoot, $wheelDir | Out-Null
          Get-ChildItem -LiteralPath $checkoutRoot -Recurse -Force | ForEach-Object {
            $relativePath = $_.FullName.Substring($checkoutRoot.Length).TrimStart([char[]]@('\', '/'))
            $pathParts = $relativePath -split '[\\/]'
            $excluded = $pathParts | Where-Object {
              $_ -in @('.git', 'build', 'dist', '__pycache__') -or $_ -like '*.egg-info'
            }
            if ($excluded -or (!$_.PSIsContainer -and $_.Extension -in @('.pyc', '.pyo'))) {
              return
            }
            $destination = Join-Path $sourceRoot $relativePath
            if ($_.PSIsContainer) {
              New-Item -ItemType Directory -Force -Path $destination | Out-Null
            } else {
              New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
              Copy-Item -LiteralPath $_.FullName -Destination $destination -Force
            }
          }
          Push-Location $sourceRoot
          try {
            python -m pip wheel --no-deps --no-build-isolation --wheel-dir $wheelDir .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
          $wheel = Get-ChildItem -Path $wheelDir -Filter "corridor_lab-0.1.1-*.whl" | Select-Object -First 1
          if ($null -eq $wheel) { throw "Expected local Corridor Lab wheel was not built." }
          Add-Content -Path $env:GITHUB_ENV -Value "CORRIDOR_LAB_WHEEL=$($wheel.FullName)"
      - name: Verify exact wheel in an isolated environment outside checkout
        shell: pwsh
        run: |
          $verifyRoot = Join-Path $env:RUNNER_TEMP "corridor-lab-wheel-verify"
          $outsideRoot = Join-Path $env:RUNNER_TEMP "corridor-lab-wheel-outside"
          New-Item -ItemType Directory -Force -Path $verifyRoot, $outsideRoot | Out-Null
          python -m venv $verifyRoot
          $isWindowsRunner = $env:RUNNER_OS -eq "Windows"
          $pythonPath = if ($isWindowsRunner) { Join-Path $verifyRoot "Scripts/python.exe" } else { Join-Path $verifyRoot "bin/python" }
          $scriptRoot = if ($isWindowsRunner) { Join-Path $verifyRoot "Scripts" } else { Join-Path $verifyRoot "bin" }
          & $pythonPath -m pip install --no-deps --no-build-isolation $env:CORRIDOR_LAB_WHEEL
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item examples/fictional-corridor/scenario.json (Join-Path $outsideRoot "scenario.json")
          $env:PYTHONPATH = ""
          Push-Location $outsideRoot
          try {
            $cliPath = if ($isWindowsRunner) { Join-Path $scriptRoot "corridorlab.exe" } else { Join-Path $scriptRoot "corridorlab" }
            $guiPath = if ($isWindowsRunner) { Join-Path $scriptRoot "corridorlab-gui.exe" } else { Join-Path $scriptRoot "corridorlab-gui" }
            & $cliPath validate scenario.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $guiPath --smoke-test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

name: portable Windows GUI

on:
  workflow_dispatch:
  push:
    tags: ["v0.1.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned build tools
        run: python -m pip install --disable-pip-version-check "setuptools==83.0.0" "pyinstaller==6.15.0"
      - name: Install TraceCanary
        run: python -m pip install --no-deps .
      - name: Build portable GUI
        run: pyinstaller --noconfirm --clean --onefile --windowed --name TraceCanary --paths src TraceCanary.pyw
      - name: Write artifact hash
        shell: pwsh
        run: |
          Compress-Archive -Path dist/TraceCanary.exe -DestinationPath dist/TraceCanary-windows-x64.zip
          (Get-FileHash dist/TraceCanary-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content -NoNewline dist/TraceCanary-windows-x64.zip.sha256
      - name: Retain portable GUI assets
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: TraceCanary-windows-x64
          path: |
            dist/TraceCanary-windows-x64.zip
            dist/TraceCanary-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

name: Repo checks

# No path filter: root-only changes (CHANGELOG, tools/, workflow and repository
# configuration) are otherwise invisible to the path-filtered package workflows.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: repo-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned ruff
        run: python -m pip install --disable-pip-version-check "ruff==0.16.10"
      - name: Lint (pyflakes and syntax errors, see ruff.toml)
        run: ruff check .

  release-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check versions, licenses and CHANGELOG structure
        run: python tools/check_release.py
      - name: Test the release check
        run: python -m unittest discover -s tools/tests -v

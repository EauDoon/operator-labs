name: Corridor Lab CI

on:
  push:
    paths:
      - "packages/corridor-lab/**"
      - ".github/workflows/corridor-lab.yml"
  pull_request:
    paths:
      - "packages/corridor-lab/**"
      - ".github/workflows/corridor-lab.yml"

permissions:
  contents: read

concurrency:
  group: corridor-lab-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/corridor-lab

jobs:
  test:
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q src
      - name: Install pinned build backend
        run: python -m pip install --disable-pip-version-check --no-deps "setuptools==83.0.0"
      - name: Build exact local wheel outside checkout
        shell: pwsh
        run: |
          $checkoutRoot = (Get-Location).Path
          $sourceRoot = Join-Path $env:RUNNER_TEMP "corridor-lab-wheel-source"
          $wheelDir = Join-Path $env:RUNNER_TEMP "corridor-lab-wheel"
          New-Item -ItemType Directory -Force -Path $sourceRoot, $wheelDir | Out-Null
          Get-ChildItem -LiteralPath $checkoutRoot -Recurse -Force | ForEach-Object {
            $relativePath = $_.FullName.Substring($checkoutRoot.Length).TrimStart([char[]]@('\', '/'))
            $pathParts = $relativePath -split '[\\/]'
            $excluded = $pathParts | Where-Object {
              $_ -in @('.git', 'build', 'dist', '__pycache__') -or $_ -like '*.egg-info'
            }
            if ($excluded -or (!$_.PSIsContainer -and $_.Extension -in @('.pyc', '.pyo'))) {
              return
            }
            $destination = Join-Path $sourceRoot $relativePath
            if ($_.PSIsContainer) {
              New-Item -ItemType Directory -Force -Path $destination | Out-Null
            } else {
              New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
              Copy-Item -LiteralPath $_.FullName -Destination $destination -Force
            }
          }
          Push-Location $sourceRoot
          try {
            python -m pip wheel --no-deps --no-build-isolation --wheel-dir $wheelDir .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
          $wheels = @(Get-ChildItem -LiteralPath $wheelDir -Filter "corridor_lab-*.whl")
          if ($wheels.Count -ne 1) { throw "Expected exactly one local Corridor Lab wheel." }
          $wheel = $wheels[0]
          Add-Content -Path $env:GITHUB_ENV -Value "CORRIDOR_LAB_WHEEL=$($wheel.FullName)"
      - name: Verify exact wheel in an isolated environment outside checkout
        shell: pwsh
        run: |
          $verifyRoot = Join-Path $env:RUNNER_TEMP "corridor-lab-wheel-verify"
          $outsideRoot = Join-Path $env:RUNNER_TEMP "corridor-lab-wheel-outside"
          New-Item -ItemType Directory -Force -Path $verifyRoot, $outsideRoot | Out-Null
          python -m venv $verifyRoot
          $isWindowsRunner = $env:RUNNER_OS -eq "Windows"
          $pythonPath = if ($isWindowsRunner) { Join-Path $verifyRoot "Scripts/python.exe" } else { Join-Path $verifyRoot "bin/python" }
          $scriptRoot = if ($isWindowsRunner) { Join-Path $verifyRoot "Scripts" } else { Join-Path $verifyRoot "bin" }
          & $pythonPath -m pip install --no-deps --no-build-isolation $env:CORRIDOR_LAB_WHEEL
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item examples/fictional-corridor/scenario.json (Join-Path $outsideRoot "scenario.json")
          $env:PYTHONPATH = ""
          $journey = (Resolve-Path tests/installed_journey.py).Path
          Push-Location $outsideRoot
          try {
            $cliPath = if ($isWindowsRunner) { Join-Path $scriptRoot "corridorlab.exe" } else { Join-Path $scriptRoot "corridorlab" }
            $guiPath = if ($isWindowsRunner) { Join-Path $scriptRoot "corridorlab-gui.exe" } else { Join-Path $scriptRoot "corridorlab-gui" }
            & $cliPath validate scenario.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $cliPath init --output analysis-scenario.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            foreach ($command in @('guardrail-headroom', 'outcome-ledger', 'deadline-profile', 'break-even-check')) {
              & $cliPath $command analysis-scenario.json --format json
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            & $cliPath transaction-grid analysis-scenario.json --parameter-a deadline_hours --values-a 1,24 --parameter-b volume_per_period --values-b 1,100 --format json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $pythonPath -I $journey
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $guiPath --smoke-test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
      - name: Build and test the sdist outside the checkout
        shell: pwsh
        run: |
          $sourceRoot = Join-Path $env:RUNNER_TEMP "corridor-lab-wheel-source"
          $sdistDir = Join-Path $env:RUNNER_TEMP "corridor-lab-sdist"
          $extractRoot = Join-Path $env:RUNNER_TEMP "corridor-lab-sdist-tree"
          New-Item -ItemType Directory -Force -Path $sdistDir, $extractRoot | Out-Null
          Push-Location $sourceRoot
          try {
            python -c "import sys; from setuptools import build_meta as b; print(b.build_sdist(sys.argv[1]))" $sdistDir
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
          $sdists = @(Get-ChildItem -LiteralPath $sdistDir -Filter "corridor_lab-*.tar.gz")
          if ($sdists.Count -ne 1) { throw "Expected exactly one Corridor Lab sdist." }
          python -c "import sys, tarfile; tarfile.open(sys.argv[1]).extractall(sys.argv[2], filter='data')" $sdists[0].FullName $extractRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $trees = @(Get-ChildItem -LiteralPath $extractRoot -Directory)
          if ($trees.Count -ne 1) { throw "Expected exactly one extracted Corridor Lab sdist tree." }
          $env:PYTHONPATH = "src"
          Push-Location $trees[0].FullName
          try {
            python -m unittest discover -s tests -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

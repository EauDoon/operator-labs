<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title description" focusable="false">
  <title id="title">Compare payment corridors</title>
  <desc id="description">A synthetic scenario can be compared, stress tested, or examined for Pareto tradeoffs. These are alternative commands, not a required sequence. Results can be reviewed in the GUI or stable reports.</desc>
  <metadata>Original vector artwork for the repository overview.</metadata>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 Z" fill="#d29922"/></marker></defs>
  <rect width="1200" height="450" rx="20" fill="#0d1117"/>
  <rect x="1" y="1" width="1198" height="448" rx="19" fill="none" stroke="#30363d" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="48" y="62" font-size="30" font-weight="750" fill="#f0f6fc">Compare payment corridors</text>
    <text x="48" y="96" font-size="18" fill="#8b949e">Fictional routes are tested across cost, timing, liquidity, and declared failure assumptions.</text>
    <line x1="48" y1="126" x2="1152" y2="126" stroke="#21262d" stroke-width="2"/>
    
    <g><rect x="48" y="199" width="262" height="98" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <rect x="48" y="199" width="5" height="98" rx="2.5" fill="#d29922"/>
    <text x="179" y="244" text-anchor="middle" font-size="19" font-weight="700" fill="#f0f6fc">Synthetic scenario</text>
    <text x="179" y="271" text-anchor="middle" font-size="14" fill="#8b949e">Choose an analysis command</text></g>
    <path d="M310 248 H356 V180 H402" fill="none" stroke="#d29922" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M310 248 H402" fill="none" stroke="#d29922" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M310 248 H356 V316 H402" fill="none" stroke="#d29922" stroke-width="2" marker-end="url(#arrow)"/>
    <g><rect x="414" y="148" width="338" height="64" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <rect x="414" y="148" width="5" height="64" rx="2.5" fill="#d29922"/>
    <text x="583" y="176" text-anchor="middle" font-size="19" font-weight="700" fill="#f0f6fc">Compare</text>
    <text x="583" y="203" text-anchor="middle" font-size="14" fill="#8b949e">Cost, time, liquidity</text></g>
    <g><rect x="414" y="216" width="338" height="64" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <rect x="414" y="216" width="5" height="64" rx="2.5" fill="#d29922"/>
    <text x="583" y="244" text-anchor="middle" font-size="19" font-weight="700" fill="#f0f6fc">Stress</text>
    <text x="583" y="271" text-anchor="middle" font-size="14" fill="#8b949e">Sensitivity and grids</text></g>
    <g><rect x="414" y="284" width="338" height="64" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <rect x="414" y="284" width="5" height="64" rx="2.5" fill="#d29922"/>
    <text x="583" y="312" text-anchor="middle" font-size="19" font-weight="700" fill="#f0f6fc">Tradeoffs</text>
    <text x="583" y="339" text-anchor="middle" font-size="14" fill="#8b949e">Pareto frontier</text></g>
    <path d="M752 180 H800 V248 H856" fill="none" stroke="#d29922" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M752 248 H856" fill="none" stroke="#d29922" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M752 316 H800 V248 H856" fill="none" stroke="#d29922" stroke-width="2" marker-end="url(#arrow)"/>
    <g><rect x="868" y="199" width="284" height="98" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <rect x="868" y="199" width="5" height="98" rx="2.5" fill="#d29922"/>
    <text x="1010" y="244" text-anchor="middle" font-size="19" font-weight="700" fill="#f0f6fc">Review results</text>
    <text x="1010" y="271" text-anchor="middle" font-size="14" fill="#8b949e">GUI or stable reports</text></g>
  
    <line x1="48" y1="372" x2="1152" y2="372" stroke="#21262d" stroke-width="2"/>
    <text x="600" y="410" text-anchor="middle" font-size="14" font-weight="600" fill="#8b949e">Offline scenario engine  •  no live pricing  •  no provider recommendation</text>
  </g>
</svg>
